version: 2
updates:
  # One entry for every Go module so that a single upstream release (for
  # example OpenTelemetry or testcontainers) produces one grouped pull request
  # across all modules instead of one pull request per module directory.
  - package-ecosystem: gomod
    directories:
      - /
      - /bench
      - /driver/bun
      - /driver/cassandra
      - /driver/clickhouse
      - /driver/dynamodb
      - /driver/firestore
      - /driver/gorm
      - /driver/mongodb
      - /driver/mongodbv2
      - /driver/pgxv5
      - /driver/redis
      - /driver/stdlib
      - /gontest
      - /otel
    schedule:
      interval: weekly
    # Our own modules are linked through go.work; Dependabot cannot bump a
    # module that is also in the workspace and fails the whole run.
    ignore:
      - dependency-name: github.com/kirimatt/goncordia/*
    groups:
      aws:
        patterns:
          - github.com/aws/aws-sdk-go-v2*
      google-cloud:
        patterns:
          - cloud.google.com/go*
          - google.golang.org/*
      observability:
        patterns:
          - go.opentelemetry.io/*
      testcontainers:
        patterns:
          - github.com/testcontainers/testcontainers-go*
      sql:
        patterns:
          - github.com/jackc/pgx/*
          - github.com/go-sql-driver/*
          - modernc.org/*
          - github.com/uptrace/bun*
          - gorm.io/*
      databases:
        patterns:
          - go.mongodb.org/*
          - github.com/redis/*
          - github.com/ClickHouse/*
          - github.com/gocql/*
          - github.com/apache/cassandra-gocql-driver*
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 4
