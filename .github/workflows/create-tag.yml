name: Create Tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v0.12.0)'
        required: true
        type: string
      ref:
        description: 'Branch or commit SHA to tag'
        required: false
        default: 'main'
        type: string

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./scripts/check-release.sh "$RELEASE_TAG"

      - name: Require a commit from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Create and push tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -- "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Extract changelog notes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          awk -v tag="$RELEASE_TAG" '
            index($0, "## [" tag "] — ") == 1 { found=1; next }
            found && /^---$/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
