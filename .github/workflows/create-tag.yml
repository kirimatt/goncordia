name: Create Tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v0.12.0)'
        required: true
        type: string
      ref:
        description: 'Branch or commit SHA to tag'
        required: false
        default: 'main'
        type: string

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./scripts/check-release.sh "$RELEASE_TAG"

      - name: Require a commit from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Create and push tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -- "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
