name: CI

env:
  ACTIONLINT_VERSION: v1.7.7
  STATICCHECK_VERSION: v0.7.0
  GOVULNCHECK_VERSION: v1.7.0
  GOWORK: 'off'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload, no token secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: '**/go.sum'
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Workflow lint
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
      - name: Module files are tidy
        run: ./scripts/for-each-module.sh go mod tidy -diff
      - name: Vet
        run: ./scripts/for-each-module.sh go vet ./...
      - name: Staticcheck
        run: ./scripts/for-each-module.sh go run "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}" ./...
      - name: Release metadata
        run: ./scripts/check-release.sh
      - name: Coverage
        run: |
          go test ./... -coverpkg=./... -covermode=atomic -coverprofile=coverage.out
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          echo "root module coverage: ${total}%"
          awk -v total="$total" 'BEGIN { if (total < 80.0) { printf "coverage %.1f%% is below 80.0%%\n", total; exit 1 } }'
      - name: Upload coverage to Codecov
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false

  test:
    name: test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: '**/go.sum'
      - name: Build
        run: ./scripts/for-each-module.sh go build ./...
      - name: Test
        run: ./scripts/for-each-module.sh go test ./... -timeout 15m -race -count=1
      - name: Test MySQL dialect on MariaDB
        working-directory: driver/stdlib
        env:
          GONCORDIA_MYSQL_IMAGE: mariadb:11.4
        run: go test ./... -run MySQL -timeout 15m -race -count=1

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: '**/go.sum'
      - name: Govulncheck
        run: ./scripts/for-each-module.sh go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...
